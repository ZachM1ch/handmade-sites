<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hexcrawl Generator</title>
<style>
:root{--ink:#1c1e1b;--paper:#e9ebe6;--card:#f6f7f3;--line:#b9bdb2;--mute:#5d6258}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 "Helvetica Neue",Arial,sans-serif}
header.top{padding:20px 16px 12px;border-bottom:2px solid var(--ink);background:var(--card)}
h1{font:700 30px/1.1 Georgia,"Palatino Linotype",serif;margin:0 0 4px;letter-spacing:.5px}
#src{color:var(--mute);font-size:13px;margin:0 0 10px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,.btn{font:inherit;padding:7px 12px;border:1.5px solid var(--ink);background:var(--ink);color:#fff;border-radius:3px;cursor:pointer}
button.alt,.btn{background:transparent;color:var(--ink)}
button:focus-visible,.btn:focus-within,input:focus-visible{outline:3px solid #2f6fb3;outline-offset:2px}
.bar label{font-size:14px}select{font:inherit;padding:5px}input[type=range]{vertical-align:middle}output{display:inline-block;min-width:2.2ch;font-weight:700}
main{max-width:1100px;margin:0 auto;padding:16px}
#hook{margin:0 0 12px;padding:10px 14px;border-left:5px solid var(--ink);background:var(--card)}
#map{display:block;width:100%;max-width:560px;margin:0 auto 18px}
.hx{cursor:pointer}.hx polygon{stroke:var(--ink);stroke-width:1.5}.hx:hover polygon{stroke-width:3}
.hx .n{font:700 20px Georgia,serif;text-anchor:middle}.hx .t{font:8px Arial,sans-serif;text-anchor:middle}
#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-left:8px solid var(--c,#999);padding:10px 12px;scroll-margin-top:12px}
.card:target{outline:2px solid var(--ink)}
.card header{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.num{flex:none;width:34px;height:34px;border-radius:50%;background:var(--c,#999);border:1.5px solid var(--ink);font:700 17px/31px Georgia,serif;text-align:center}
.card h3{margin:0;font:700 17px/1.2 Georgia,serif}.lm{color:var(--mute);font-size:14px}
.card p{margin:6px 0}.card i{color:var(--mute)}
.set{margin:8px 0;padding:8px 10px;background:#fff;border:1px solid var(--line)}
.set h4{margin:0;font:700 16px Georgia,serif}.set small{font:13px Arial,sans-serif;color:var(--mute)}
.alt-n{font-size:12.5px;color:var(--mute);margin:2px 0 6px}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:14px}dt{font-weight:700}dd{margin:0}
.desc{width:100%;margin-top:6px;font:inherit;font-size:14px;border:0;border-bottom:1.5px dotted var(--mute);background:transparent;padding:4px 0}
@media print{.bar,#src{display:none}body{background:#fff}header.top{background:#fff}.card{break-inside:avoid}#map{max-width:400px}.desc{border-bottom:1px solid #000}}
#seed{font:inherit;padding:5px;border:1.5px solid var(--ink);background:#fff;width:11em}
#legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;margin:-6px 0 16px;font-size:13px}
#legend i{display:inline-block;width:14px;height:14px;border:1.5px solid var(--ink);vertical-align:-2px;margin-right:5px}
.act{display:flex;gap:12px;align-items:center;margin-top:6px;font-size:13px}.act button{padding:2px 9px;font-size:13px}
@media print{.act{display:none}#cards{grid-template-columns:1fr 1fr}#map{max-width:430px!important}}
#hint{text-align:center;color:var(--mute);font-size:13px;margin:-10px 0 16px}
#map{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.hx.lk polygon{stroke-width:4.5}
#ctx{position:fixed;z-index:10;min-width:160px;background:var(--card);border:1.5px solid var(--ink);box-shadow:3px 3px 0 rgba(0,0,0,.25)}
#ctx .hd{padding:6px 14px;font-weight:700;border-bottom:1px solid var(--line)}
#ctx button{display:block;width:100%;text-align:left;background:transparent;color:var(--ink);border:0;border-radius:0;padding:11px 14px}
#ctx button:hover,#ctx button:focus-visible{background:var(--ink);color:#fff;outline:none}
@media print{#ctx,#hint{display:none}}
</style>
</head>
<body>
<header class="top">
  <h1 id="title">Hexcrawl Generator</h1>
  <p id="src"></p>
  <div class="bar">
    <button id="gen">Generate new map</button>
    <label>Seed <input id="seed" type="text" placeholder="seed code" aria-label="Seed code"></label>
    <button class="alt" id="pdf">Download PDF</button>
    <button class="alt" id="txt">Download text</button>
    <button class="alt" id="save">Save map</button>
    <label class="btn">Load map<input id="mapfile" type="file" hidden></label>
    <label class="btn">Load tables JSON<input id="file" type="file" accept=".json,application/json" hidden></label>
    <label><input id="centre" type="checkbox" checked> Friendly settlement in centre hex</label>
  </div>
  <div class="bar" style="margin-top:8px">
    <label>Grid size <select id="grid"></select></label>
    <label>Settlements, min <input id="smin" type="range" min="1" max="19" value="2"> <output id="vmin"></output></label>
    <label>max <input id="smax" type="range" min="1" max="19" value="4"> <output id="vmax"></output></label>
  </div>
</header>
<main>
  <div id="hook"></div>
  <svg id="map" role="img" aria-label="Hex map"></svg>
  <div id="legend"></div>
  <p id="hint">Right-click or long-press a hex to lock or reroll it.</p>
  <div id="cards"></div>
</main>
<div id="ctx" role="menu" hidden></div>

<script>
const $=s=>document.querySelector(s);
let rng=Math.random;
const mulberry=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const r=n=>1+Math.floor(rng()*n);
const pick=a=>a[Math.floor(rng()*a.length)];
const pickN=(a,n)=>{const c=[...a],o=[];while(o.length<n&&c.length)o.push(c.splice(Math.floor(rng()*c.length),1)[0]);return o};
const ranged=(t,n)=>t.find(e=>n>=e.min&&n<=e.max)||t[t.length-1];
const dmax=t=>Math.max(...t.map(e=>e.max));
const tp=e=>Array.isArray(e)?e:[e,''];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cap=s=>s[0].toUpperCase()+s.slice(1);
let COL={};
const PAL=['#cfc27a','#76a06f','#80aac6','#ada4ac','#c98f7a','#9a86b8','#7fb5a0','#d0b06a'];
function buildCOL(){COL={};T.hexType.forEach((e,i)=>COL[e.key]=e.color||PAL[i%PAL.length]);COL.centre=(T.legend&&T.legend.centre&&T.legend.centre.color)||'#d9985a'}
let T,state,srcName;

function mkName(){
  const S=T.settlement,i=r(S.nameStart[0].length)-1,j=r(S.nameEnd[0].length)-1;
  const starts=S.nameStart.map(c=>c[i]),ends=S.nameEnd.map(c=>c[j]);
  const all=[];starts.forEach(a=>ends.forEach(b=>all.push(cap(a)+b.toLowerCase())));
  const main=pick(all);return {main,alts:all.filter(x=>x!==main)};
}
function genSettlement(){
  const S=T.settlement,n=S.size.length,si=Math.min(r(n),r(n)),sz=S.size[si-1];
  return {size:sz,gov:ranged(S.governance,r(6)+si).text,inh:pick(S.inhabitants),
    feat:pickN(S.features,sz.features||1),ind:pickN(S.industry,sz.industry||1),event:pick(S.events),
    name:mkName(),tavern:sz.tavern?{name:`The ${pick(S.tavernA)} ${pick(S.tavernB)}`,meal:pick(S.meals)}:null};
}
const DIRS=[[1,0],[0,1],[-1,1],[-1,0],[0,-1],[1,-1]];
function buildGrid(R){
  const g=[{n:1,q:0,r:0}];let n=2;
  for(let k=1;k<=R;k++){let q=0,r=-k;for(const[dq,dr]of DIRS)for(let i=0;i<k;i++){g.push({n:n++,q,r});q+=dq;r+=dr}}
  return g;
}
const hexCount=R=>3*R*(R+1)+1;
function genHex(n,isCentre,isSet){
  const h={n};
  if(isCentre){h.type='Friendly settlement';h.key='centre';h.set=genSettlement();return h;}
  const ty=ranged(T.hexType,r(dmax(T.hexType)));h.type=ty.name;h.key=ty.key;
  h.landmark=pick(T.landmarks[ty.key]);
  const d=(isSet&&T.details.find(x=>x.settlement))||pick(T.details.filter(x=>!x.settlement));
  if(d.settlement){h.detail=d.text;h.set=genSettlement();}else h.detail=pick(d.entries);
  return h;
}
function generate(){
  const sv=$('#seed').value.trim(),m=/^(\d)\.(\d+)\.(\d+)\.([01])\.(\w+)$/.exec(sv);
  if(sv&&!m){alert('Seed codes look like 2.2.4.1.k3j9x1');return}
  if(m){$('#grid').value=m[1];setRanges(+m[1],false);$('#smin').value=m[2];$('#smax').value=m[3];showRanges();$('#centre').checked=m[4]==='1'}
  const tok=m?m[5]:Math.random().toString(36).slice(2,8);
  rng=mulberry(tok.split('').reduce((a,c)=>(a*31+c.charCodeAt(0))|0,7));
  const R=+$('#grid').value,grid=buildGrid(R),c=T.map.centre||1,cen=$('#centre').checked;
  const lo=+$('#smin').value,hi=+$('#smax').value,want=lo+Math.floor(rng()*(hi-lo+1));
  const keep=new Map((state&&state.grid.length===grid.length?state.hexes:[]).filter(h=>h.locked).map(h=>[h.n,h]));
  const free=grid.map(g=>g.n).filter(n=>!keep.has(n)),cenFree=cen&&free.includes(c);
  const have=[...keep.values()].filter(h=>h.set).length+(cenFree?1:0);
  const sett=new Set(pickN(free.filter(n=>!(cenFree&&n===c)),Math.max(0,want-have)));
  state={grid,hook:pick(T.hooks),hexes:grid.map(g=>keep.get(g.n)||genHex(g.n,cenFree&&g.n===c,sett.has(g.n)))};
  $('#seed').value=keep.size?'':`${R}.${lo}.${hi}.${cen?1:0}.${tok}`;
  $('#title').textContent=T.title||'Hexcrawl Generator';
  $('#src').textContent='Tables: '+srcName;
  render();
}
const hx=n=>state.hexes.find(h=>h.n===n);
function reroll(n){
  const i=state.hexes.findIndex(h=>h.n===n),o=state.hexes[i];
  rng=Math.random;
  const h=genHex(n,o.key==='centre',!!o.set);h.locked=o.locked;state.hexes[i]=h;
  $('#h'+n).outerHTML=card(h);drawMap();$('#seed').value='';
}
const legendItems=()=>[...T.hexType.map(e=>[e.legend||e.name,e.key]),[((T.legend||{}).centre||{}).label||'Centre settlement','centre']];
const legendNote=()=>(T.legend&&T.legend.settlement)||'House icon: settlement';
function legend(){
  $('#legend').innerHTML=legendItems().map(([n,k])=>`<span><i style="background:${COL[k]||'#ddd'}"></i>${esc(n)}</span>`).join('')+`<span>${esc(legendNote())}</span>`;
}
function svgLabel(h,x,y){
  const w=[];let l='';
  for(const t of (h.set?h.set.name.main:(h.landmark||'')).split(' ')){const c=l?l+' '+t:t;if(l&&c.length>11){w.push(l);l=t}else l=c}
  w.push(l);
  const L=w.slice(0,2).map(s=>s.length>11?s.slice(0,10)+'…':s);if(w.length>2)L[1]=L[1].replace(/.$/,'…');
  return L.map((s,i)=>`<text class="t" x="${x}" y="${y+14+i*10}">${esc(s)}</text>`).join('');
}
function validate(t){
  const need=(c,m)=>{if(!c)throw new Error(m)},arr=(a,m)=>need(Array.isArray(a)&&a.length,m+' must be a non-empty list');
  need(t&&t.map,'missing "map"');arr(t.hexType,'"hexType"');
  t.hexType.forEach((e,i)=>{need(e.name&&e.key&&e.min>=1&&e.max>=e.min,`hexType[${i}] needs name, key, min and max`);need(!e.color||/^#[0-9a-f]{6}$/i.test(e.color),`hexType[${i}].color must look like #a1b2c3`);arr(t.landmarks&&t.landmarks[e.key],`"landmarks.${e.key}"`)});
  arr(t.details,'"details"');
  t.details.forEach((d,i)=>need(d.settlement||(Array.isArray(d.entries)&&d.entries.length),`details[${i}] needs "settlement": true or a non-empty "entries" list`));
  arr(t.hooks,'"hooks"');const S=t.settlement;need(S,'missing "settlement"');
  ['size','governance','inhabitants','features','industry','events','tavernA','tavernB','meals'].forEach(k=>arr(S[k],`"settlement.${k}"`));
  S.size.forEach((e,i)=>need(e.name&&e.note,`settlement.size[${i}] needs name and note`));
  S.governance.forEach((e,i)=>need(e.text&&e.min>=1&&e.max>=e.min,`settlement.governance[${i}] needs text, min and max`));
  ['nameStart','nameEnd'].forEach(k=>{arr(S[k],`"settlement.${k}"`);S[k].forEach((c,i)=>arr(c,`"settlement.${k}[${i}]"`))});
  const cc=t.legend&&t.legend.centre&&t.legend.centre.color;need(!cc||/^#[0-9a-f]{6}$/i.test(cc),'legend.centre.color must look like #a1b2c3');
  return t;
}
function setRanges(R,reset){
  const N=hexCount(R),a=$('#smin'),b=$('#smax');a.max=b.max=N;
  if(reset){a.value=Math.max(1,Math.round(N/10));b.value=Math.max(+a.value,Math.round(N/5))}
  else{a.value=Math.min(+a.value,N);b.value=Math.min(+b.value,N)}
  showRanges();
}
function showRanges(){$('#vmin').textContent=$('#smin').value;$('#vmax').textContent=$('#smax').value}
function initControls(){
  const R0=T.map.radius||2;
  $('#grid').innerHTML=[1,2,3,4,5,6].map(R=>`<option value="${R}"${R===R0?' selected':''}>${2*R+1} across (${hexCount(R)} hexes)</option>`).join('');
  setRanges(R0,true);
}
const rows=s=>[['Governance',s.gov],['Inhabitants',s.inh],['Notable feature',s.feat.join('; ')],['Industry',s.ind.join('; ')],['Event',s.event]]
  .concat(s.tavern?[['Tavern',`${s.tavern.name} (specialty: ${s.tavern.meal})`]]:[]);
const setBlock=s=>`<section class="set"><p class="alt-n">Other names: ${s.name.alts.map(esc).join(', ')}</p><dl>${rows(s).map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl></section>`;
function card(h){
  const s=h.set,[d,q]=h.detail&&!s?tp(h.detail):['',''];
  const title=s?s.name.main:h.landmark,sub=s?`${s.size.name}, ${s.size.note}`:h.type;
  return `<article class="card" id="h${h.n}" style="--c:${COL[h.key]||'#bbb'}"><header><span class="num">${h.n}</span><div><h3>${esc(title)}</h3><div class="lm">${esc(sub)}</div></div></header>
${s&&h.landmark?`<p class="lm">${esc(h.type)}: ${esc(h.landmark)}</p>`:''}${d?`<p><b>${esc(d)}</b>${q?` <i>${esc(q)}</i>`:''}</p>`:''}${s?setBlock(s):''}
<input class="desc" value="${esc(h.desc||'')}" oninput="hx(${h.n}).desc=this.value" placeholder="One-line description" aria-label="One-line description for hex ${h.n}">
<div class="act"><label><input type="checkbox" ${h.locked?'checked':''} onchange="hx(${h.n}).locked=this.checked;drawMap()"> Lock</label><button class="alt" onclick="reroll(${h.n})">Reroll</button></div></article>`;
}
function drawMap(){
  const s=40,h=Math.sqrt(3)*s,by={};state.hexes.forEach(x=>by[x.n]=x);
  let o='',x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  state.grid.forEach(({n,q,r})=>{
    const x=1.5*q*s,y=h*(r+q/2),k=by[n];
    x0=Math.min(x0,x-s);x1=Math.max(x1,x+s);y0=Math.min(y0,y-h/2);y1=Math.max(y1,y+h/2);
    const p=[0,1,2,3,4,5].map(a=>[x+s*Math.cos(a*Math.PI/3),y+s*Math.sin(a*Math.PI/3)].map(v=>v.toFixed(1)).join(',')).join(' ');
    o+=`<g class="hx${k.locked?' lk':''}" data-n="${n}"><title>${esc(k.set?k.set.name.main:k.landmark||'')} (${esc(k.type)})</title><polygon points="${p}" fill="${COL[k.key]||'#ddd'}"/><text class="n" x="${x}" y="${y+2}">${n}</text>${svgLabel(k,x,y)}${k.set?`<path transform="translate(${x},${y-26})" d="M-6,0L0,-6L6,0V6H-6Z" fill="#1c1e1b"/>`:''}</g>`;
  });
  $('#map').setAttribute('viewBox',`${x0-4} ${y0-4} ${x1-x0+8} ${y1-y0+8}`);
  $('#map').style.maxWidth=Math.min(1000,(x1-x0)*1.75)+'px';
  $('#map').innerHTML=o;
}
function render(){
  closeMenu();
  $('#hook').innerHTML=`<b>Starting adventure hook:</b> ${esc(state.hook)}`;
  drawMap();legend();$('#cards').innerHTML=state.hexes.map(card).join('');
}
function hexInfo(h){
  const s=h.set,L=[];
  if(s&&h.landmark)L.push(`${h.type}: ${h.landmark}`);
  if(h.detail&&!s){const[d,q]=tp(h.detail);L.push(d+(q?` (${q})`:''))}
  if((h.desc||'').trim())L.push('Description: '+h.desc.trim());
  if(s){L.push('Other names: '+s.name.alts.join(', '));rows(s).forEach(([k,v])=>L.push(`${k}: ${v}`))}
  return {title:s?s.name.main:h.landmark,sub:s?`${s.size.name}, ${s.size.note}`:h.type,lines:L};
}
function toText(){
  const L=[(T.title||'Hexcrawl').toUpperCase(),'Generated '+new Date().toLocaleString(),'',`STARTING HOOK: ${state.hook}`,'',''];
  state.hexes.forEach(h=>{const i=hexInfo(h);L.push(`HEX ${h.n}: ${i.title}`,i.sub,'-'.repeat(40),...i.lines,'','')});
  return L.join('\n');
}
function makePDF(){
  const W=612,H=792,M=40,pages=[],cv=document.createElement('canvas').getContext('2d');
  let cur,y;
  const lat=s=>String(s).replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D]/g,'"').replace(/[\u2013\u2014]/g,'-').replace(/\u2026/g,'...').replace(/[^\x20-\x7E\xA0-\xFF]/g,'?');
  const pe=s=>lat(s).replace(/([\\()])/g,'\\$1');
  const wd=(s,z,b)=>{cv.font=`${b?'bold ':''}${z}px Helvetica,Arial,sans-serif`;return cv.measureText(lat(s)).width};
  const rgb=h=>[1,3,5].map(i=>(parseInt(h.substr(i,2),16)/255).toFixed(3)).join(' ');
  const page=()=>{cur=[];pages.push(cur);y=M};
  const txt=(x,yy,s,z,b,c)=>cur.push(`BT /F${b?2:1} ${z} Tf ${c||'0 0 0'} rg ${x.toFixed(1)} ${(H-yy).toFixed(1)} Td (${pe(s)}) Tj ET`);
  const rect=(x,yy,w,h,c)=>cur.push(`${c} rg ${x.toFixed(1)} ${(H-yy-h).toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)} re f`);
  const wrap=(s,z,b,mw)=>{const o=[];let l='';for(const w of String(s).split(' ')){const t=l?l+' '+w:w;if(l&&wd(t,z,b)>mw){o.push(l);l=w}else l=t}return o.concat(l)};
  const col=k=>rgb(COL[k]||'#dddddd'),grey='0.35 0.35 0.35';
  page();
  txt(M,y+18,T.title||'Hexcrawl',20,1);y+=32;
  txt(M,y,'Generated '+new Date().toLocaleDateString(),9,0,grey);y+=18;
  wrap('Starting hook: '+state.hook,11,0,W-2*M).forEach(l=>{txt(M,y,l,11);y+=14});y+=8;
  const s=40,hh=Math.sqrt(3)*s,cells=state.grid.map(({n,q,r})=>({n,x:1.5*q*s,y:hh*(r+q/2)}));
  const x0=Math.min(...cells.map(c=>c.x))-s,x1=Math.max(...cells.map(c=>c.x))+s,y0=Math.min(...cells.map(c=>c.y))-hh/2,y1=Math.max(...cells.map(c=>c.y))+hh/2;
  const k=Math.min((W-2*M)/(x1-x0),(H-y-M-40)/(y1-y0)),ox=(W-(x1-x0)*k)/2,oy=y,X=u=>ox+(u-x0)*k,Y=u=>oy+(u-y0)*k;
  cells.forEach(c=>{
    const h=hx(c.n),pts=[0,1,2,3,4,5].map(a=>`${X(c.x+s*Math.cos(a*Math.PI/3)).toFixed(1)} ${(H-Y(c.y+s*Math.sin(a*Math.PI/3))).toFixed(1)}`);
    cur.push(`${col(h.key)} rg 0 0 0 RG 0.8 w ${pts[0]} m ${pts.slice(1).map(p=>p+' l').join(' ')} h B`);
    const z=18*k;txt(X(c.x)-wd(c.n,z,1)/2,Y(c.y)+z*0.35,String(c.n),z,1);
    if(7*k>=4)wrap(h.set?h.set.name.main:(h.landmark||''),7*k,0,s*1.25*k).slice(0,2).forEach((l,j)=>txt(X(c.x)-wd(l,7*k)/2,Y(c.y)+13*k+j*8*k,l,7*k));
    if(h.set){const px=X(c.x),py=Y(c.y-30),u=4*k;rect(px-u,py,2*u,1.5*u,'0 0 0');cur.push(`0 0 0 rg ${(px-1.4*u).toFixed(1)} ${(H-py).toFixed(1)} m ${px.toFixed(1)} ${(H-py+1.5*u).toFixed(1)} l ${(px+1.4*u).toFixed(1)} ${(H-py).toFixed(1)} l h f`)}
  });
  y=oy+(y1-y0)*k+16;let lx=M;
  legendItems().forEach(([n,key])=>{rect(lx,y-8,9,9,col(key));txt(lx+13,y,n,9);lx+=wd(n,9)+28});
  txt(lx,y,legendNote(),9);
  page();
  state.hexes.forEach(h=>{
    const i=hexInfo(h),ls=i.lines.flatMap(l=>wrap(l,10,0,W-2*M-16)),ht=40+ls.length*12.5;
    if(y+ht>H-M)page();
    rect(M,y-4,5,ht-10,col(h.key));
    txt(M+14,y+10,`${h.n}. ${i.title}`,12,1);txt(M+14,y+23,i.sub,10,0,grey);
    ls.forEach((l,j)=>txt(M+14,y+36+j*12.5,l,10));
    y+=ht+8;
  });
  let out='%PDF-1.4\n';const off=[],add=o=>{off.push(out.length);out+=`${off.length} 0 obj\n${o}\nendobj\n`};
  add('<</Type/Catalog/Pages 2 0 R>>');
  add(`<</Type/Pages/Kids[${pages.map((_,i)=>`${5+2*i} 0 R`).join(' ')}]/Count ${pages.length}>>`);
  add('<</Type/Font/Subtype/Type1/BaseFont/Helvetica/Encoding/WinAnsiEncoding>>');
  add('<</Type/Font/Subtype/Type1/BaseFont/Helvetica-Bold/Encoding/WinAnsiEncoding>>');
  pages.forEach((p,i)=>{const c=p.join('\n');add(`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${W} ${H}]/Resources<</Font<</F1 3 0 R/F2 4 0 R>>>>/Contents ${6+2*i} 0 R>>`);add(`<</Length ${c.length}>>\nstream\n${c}\nendstream`)});
  const xr=out.length;
  out+=`xref\n0 ${off.length+1}\n0000000000 65535 f \n`+off.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<</Size ${off.length+1}/Root 1 0 R>>\nstartxref\n${xr}\n%%EOF`;
  const u=new Uint8Array(out.length);for(let i=0;i<out.length;i++)u[i]=out.charCodeAt(i)&255;
  return u;
}
function loadMap(t,name){
  const m=JSON.parse(t);
  if(m.format!=='mausmap'||!Array.isArray(m.hexes)||!m.settings)throw new Error('this is not a .mausmap file');
  const R=m.settings.radius;
  if(!(R>=1&&R<=6)||m.hexes.length!==hexCount(R))throw new Error('the hex count does not match the grid size');
  $('#grid').value=R;setRanges(R,false);$('#smin').value=m.settings.min;$('#smax').value=m.settings.max;showRanges();$('#centre').checked=!!m.settings.centre;
  $('#seed').value=m.seed||'';state={grid:buildGrid(R),hook:m.hook,hexes:m.hexes};
  $('#src').textContent='Map: '+name;render();
}
function download(name,data,type){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:type||'text/plain'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
let ctxN=null,openedAt=0,skipUntil=0,lp=null,lpFired=false;
function openMenu(n,x,y){
  ctxN=n;openedAt=Date.now();const h=hx(n),m=$('#ctx');
  m.innerHTML=`<div class="hd">Hex ${n}</div><button data-a="lock">${h.locked?'Unlock':'Lock'}</button><button data-a="reroll">Reroll</button><button data-a="jump">Jump to card</button>`;
  m.hidden=false;
  m.style.left=Math.max(4,Math.min(x+12,innerWidth-m.offsetWidth-4))+'px';
  m.style.top=Math.max(4,Math.min(y+12,innerHeight-m.offsetHeight-4))+'px';
}
function closeMenu(){$('#ctx').hidden=true}
const mp=$('#map');
mp.addEventListener('contextmenu',e=>{const g=e.target.closest('.hx');if(!g)return;e.preventDefault();openMenu(+g.dataset.n,e.clientX,e.clientY)});
mp.addEventListener('touchstart',e=>{
  lpFired=false;clearTimeout(lp);const g=e.target.closest('.hx');if(!g||e.touches.length!==1)return;
  const t=e.touches[0];lp=setTimeout(()=>{lpFired=true;openMenu(+g.dataset.n,t.clientX,t.clientY)},500);
},{passive:true});
mp.addEventListener('touchmove',()=>clearTimeout(lp),{passive:true});
mp.addEventListener('touchcancel',()=>clearTimeout(lp),{passive:true});
mp.addEventListener('touchend',()=>{clearTimeout(lp);if(lpFired){skipUntil=Date.now()+600;lpFired=false}},{passive:true});
mp.addEventListener('click',e=>{if(Date.now()<skipUntil)return;const g=e.target.closest('.hx');if(g)location.hash='h'+g.dataset.n});
document.addEventListener('click',e=>{if(Date.now()<skipUntil)return;if(!e.target.closest('#ctx'))closeMenu()},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
addEventListener('scroll',closeMenu,{passive:true});
$('#ctx').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||Date.now()-openedAt<350)return;
  const n=ctxN,a=b.dataset.a;closeMenu();
  if(a==='lock'){const h=hx(n);h.locked=!h.locked;$('#h'+n).outerHTML=card(h);drawMap()}
  else if(a==='reroll')reroll(n);
  else $('#h'+n).scrollIntoView({behavior:'smooth',block:'center'});
});
$('#gen').onclick=()=>{$('#seed').value='';generate()};
$('#seed').onchange=generate;
$('#grid').onchange=()=>{$('#seed').value='';setRanges(+$('#grid').value,true);generate()};
$('#smin').oninput=()=>{if(+$('#smin').value>+$('#smax').value)$('#smax').value=$('#smin').value;showRanges()};
$('#smax').oninput=()=>{if(+$('#smax').value<+$('#smin').value)$('#smin').value=$('#smax').value;showRanges()};
$('#txt').onclick=()=>download('hexcrawl.txt',toText());
$('#pdf').onclick=()=>download('hexcrawl.pdf',makePDF(),'application/pdf');
$('#save').onclick=()=>download('hexcrawl.mausmap',JSON.stringify({format:'mausmap',version:1,title:T.title,seed:$('#seed').value,settings:{radius:+$('#grid').value,min:+$('#smin').value,max:+$('#smax').value,centre:$('#centre').checked},hook:state.hook,hexes:state.hexes},null,1),'application/json');
$('#mapfile').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{loadMap(t,f.name)}catch(err){alert('Could not load '+f.name+': '+err.message)}});e.target.value=''};
$('#file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  f.text().then(t=>{try{T=validate(JSON.parse(t));buildCOL();srcName=f.name;generate()}catch(err){alert('Could not use '+f.name+': '+err.message)}});
  e.target.value='';
};
(async()=>{
  let ft=null,note='';
  try{const res=await fetch('hexcrawl-tables.json');if(res.ok)ft=await res.json()}catch(e){}
  if(ft){try{T=validate(ft);srcName='hexcrawl-tables.json'}catch(e){note=e.message}}
  if(!T){T=validate(JSON.parse($('#default-tables').textContent));srcName='built-in copy'+(note?` (hexcrawl-tables.json was ignored: ${note})`:' (load a JSON to replace)')}
  buildCOL();initControls();generate();
})();
</script>
</body>
</html>
