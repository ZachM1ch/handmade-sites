<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hexcrawl Generator</title>
<link rel="icon" href="data:,">
<style>
:root{--ink:#1c1e1b;--paper:#e9ebe6;--card:#f6f7f3;--line:#b9bdb2;--mute:#5d6258}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 "Helvetica Neue",Arial,sans-serif}
header.top{padding:20px 16px 12px;border-bottom:2px solid var(--ink);background:var(--card)}
h1{font:700 30px/1.1 Georgia,"Palatino Linotype",serif;margin:0 0 4px;letter-spacing:.5px}
#src{color:var(--mute);font-size:13px;margin:0 0 10px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,.btn{font:inherit;padding:7px 12px;border:1.5px solid var(--ink);background:var(--ink);color:#fff;border-radius:3px;cursor:pointer}
button.alt,.btn{background:transparent;color:var(--ink)}
button:focus-visible,.btn:focus-within,input:focus-visible{outline:3px solid #2f6fb3;outline-offset:2px}
.bar label{font-size:14px}select{font:inherit;padding:5px}input[type=range]{vertical-align:middle}output{display:inline-block;min-width:2.2ch;font-weight:700}
main{max-width:1100px;margin:0 auto;padding:16px}
#hook{margin:0 0 12px;padding:10px 14px;border-left:5px solid var(--ink);background:var(--card)}
#map{display:block;width:100%;max-width:560px;margin:0 auto 18px}
.hx{cursor:pointer}.hx polygon{stroke:var(--ink);stroke-width:1.5}.hx:hover polygon{stroke-width:3}
.hx .n{font:700 20px Georgia,serif;text-anchor:middle}.hx .t{font:8px Arial,sans-serif;text-anchor:middle}
#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-left:8px solid var(--c,#999);padding:10px 12px;scroll-margin-top:12px}
.card:target{outline:2px solid var(--ink)}
.card header{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.num{flex:none;width:34px;height:34px;border-radius:50%;background:var(--c,#999);border:1.5px solid var(--ink);font:700 17px/31px Georgia,serif;text-align:center}
.card h3{margin:0;font:700 17px/1.2 Georgia,serif}.lm{color:var(--mute);font-size:14px}
.card p{margin:6px 0}.card i{color:var(--mute)}
.set{margin:8px 0;padding:8px 10px;background:#fff;border:1px solid var(--line)}
.set h4{margin:0;font:700 16px Georgia,serif}.set small{font:13px Arial,sans-serif;color:var(--mute)}
.alt-n{font-size:12.5px;color:var(--mute);margin:2px 0 6px}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:14px}dt{font-weight:700}dd{margin:0}
.desc{width:100%;margin-top:6px;font:inherit;font-size:14px;border:0;border-bottom:1.5px dotted var(--mute);background:transparent;padding:4px 0}
@media print{.bar,#src{display:none}body{background:#fff}header.top{background:#fff}.card{break-inside:avoid}#map{max-width:400px}.desc{border-bottom:1px solid #000}}
#seed{font:inherit;padding:5px;border:1.5px solid var(--ink);background:#fff;width:11em}
#legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;margin:-6px 0 16px;font-size:13px}
#legend i{display:inline-block;width:14px;height:14px;border:1.5px solid var(--ink);vertical-align:-2px;margin-right:5px}
.act{display:flex;gap:12px;align-items:center;margin-top:6px;font-size:13px}.act button{padding:2px 9px;font-size:13px}
@media print{.act{display:none}#cards{grid-template-columns:1fr 1fr}#map{max-width:430px!important}}
#hint{text-align:center;color:var(--mute);font-size:13px;margin:-10px 0 16px}
#map{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.hx.lk polygon{stroke-width:4.5}
#ctx{position:fixed;z-index:10;min-width:160px;background:var(--card);border:1.5px solid var(--ink);box-shadow:3px 3px 0 rgba(0,0,0,.25)}
#ctx .hd{padding:6px 14px;font-weight:700;border-bottom:1px solid var(--line)}
#ctx button{display:block;width:100%;text-align:left;background:transparent;color:var(--ink);border:0;border-radius:0;padding:11px 14px}
#ctx button:hover,#ctx button:focus-visible{background:var(--ink);color:#fff;outline:none}
@media print{#ctx,#hint{display:none}}

.tabs{display:flex;gap:4px;margin:0 0 10px}
.tabs button{background:transparent;color:var(--ink);padding:5px 18px;border-bottom-width:3px}
.tabs button[aria-selected=true]{background:var(--ink);color:#fff}
body.tab-tables .mapctl{display:none!important}
#tablesview[hidden],#mapview[hidden]{display:none}
#tablesview h2{font:700 22px Georgia,"Palatino Linotype",serif;margin:26px 0 6px;padding-bottom:4px;border-bottom:2px solid var(--ink)}
#tablesview h2:first-child{margin-top:0}
#tablesview>p.note{margin:0 0 10px;color:var(--mute);font-size:14px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;align-items:start}
.tbl{background:var(--card);border:1px solid var(--line);border-left:8px solid var(--c,var(--ink));padding:8px 10px;overflow-x:auto}
.tbl.wide{grid-column:1/-1}
.tbl h3{margin:0;font:700 16px Georgia,serif;display:flex;justify-content:space-between;gap:8px}
.tbl h3 span{font:700 13px Arial,sans-serif;color:var(--mute);white-space:nowrap}
.tbl .note{margin:2px 0 6px;font-size:13px;color:var(--mute)}
.tbl table{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;border-bottom:2px solid var(--ink);padding:3px 10px 3px 4px;white-space:nowrap}
.tbl td{padding:3px 10px 3px 4px;vertical-align:top}
.tbl tbody tr:nth-child(even) td{background:rgba(0,0,0,.05)}
.tbl td:first-child,.tbl td.nw{width:1%;white-space:nowrap;font-weight:700}
@media print{.tabs{display:none}}
#tbbar{margin-bottom:8px}#tbsel{max-width:70vw}#tbmsg{font-size:13px;color:var(--mute)}
.hist{position:sticky;top:0;z-index:5;background:var(--card);border:1.5px solid var(--ink);padding:6px 12px;margin:0 0 14px;box-shadow:0 3px 8px rgba(0,0,0,.12)}
.hist[hidden]{display:none}
.hist header{display:flex;justify-content:space-between;align-items:center}
.hist button{padding:1px 9px;font-size:13px}
.hist ol{margin:4px 0 0;padding-left:20px;font-size:13.5px;max-height:7.5em;overflow:auto}
.hist li b{font-weight:700}.hist li span{color:var(--mute)}
.tbl h3{align-items:center}.tbl h3 .hr{display:flex;gap:8px;align-items:center}
.rollbtn{padding:2px 12px;font-size:13px}
.tbl .res{margin:2px 0 6px;font-size:14px;padding:4px 8px;background:#fff3c4;border-left:4px solid #d4a017}.tbl .res:empty{display:none}
.tbl tr.hit td,.tbl td.hit{background:#ffe08a!important;font-weight:700}
@media print{.hist,.rollbtn,.res{display:none}}
</style>
</head>
<body>
<header class="top">
  <h1 id="title">Hexcrawl Generator</h1>
  <p id="src"></p>
  <nav class="tabs" role="tablist" aria-label="View">
    <button role="tab" id="tab-map" aria-selected="true">Map</button>
    <button role="tab" id="tab-tables" aria-selected="false">Tables</button>
  </nav>
  <div class="bar" id="tbbar">
    <label>Tables <select id="tbsel" aria-label="Active tables"></select></label>
    <button class="alt" id="tbdel" hidden>Remove</button>
    <label class="btn">Add tables JSON<input id="file" type="file" accept=".json,application/json" multiple hidden></label>
    <span id="tbmsg" role="status"></span>
  </div>
  <div class="bar">
    <button class="mapctl" id="gen">Generate new map</button>
    <label class="mapctl">Seed <input id="seed" type="text" placeholder="seed code" aria-label="Seed code"></label>
    <button class="alt" id="pdf">Download PDF</button>
    <button class="alt mapctl" id="png">Download PNG</button>
    <button class="alt" id="txt">Download text</button>
    <button class="alt mapctl" id="save">Save map</button>
    <label class="btn mapctl">Load map<input id="mapfile" type="file" hidden></label>
    <label class="mapctl"><input id="centre" type="checkbox" checked> Friendly settlement in centre hex</label>
  </div>
  <div class="bar mapctl" style="margin-top:8px">
    <label>Grid size <select id="grid"></select></label>
    <label>Settlements, min <input id="smin" type="range" min="1" max="19" value="2"> <output id="vmin"></output></label>
    <label>max <input id="smax" type="range" min="1" max="19" value="4"> <output id="vmax"></output></label>
    <label title="Neighbouring hexes tend to share a biome, so the map forms regions"><input id="cluster" type="checkbox"> Cluster biomes</label>
    <label title="Settlements favour biomes and neighbours the tables file weights highly"><input id="terrain" type="checkbox"> Terrain-aware settlements</label>
  </div>
</header>
<main>
  <div id="mapview">
  <div id="hook"></div>
  <svg id="map" role="img" aria-label="Hex map"></svg>
  <div id="legend"></div>
  <p id="hint">Right-click or long-press a hex to lock or reroll it.</p>
  <div id="cards"></div>
  </div>
  <div id="tablesview" hidden></div>
</main>

<script>
const $=s=>document.querySelector(s);
let rng=Math.random;
const mulberry=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const r=n=>1+Math.floor(rng()*n);
const pick=a=>a[Math.floor(rng()*a.length)];
const pickN=(a,n)=>{const c=[...a],o=[];while(o.length<n&&c.length)o.push(c.splice(Math.floor(rng()*c.length),1)[0]);return o};
const ranged=(t,n)=>t.find(e=>n>=e.min&&n<=e.max)||t[t.length-1];
const dmax=t=>Math.max(...t.map(e=>e.max));
const tp=e=>Array.isArray(e)?e:[e,''];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cap=s=>s[0].toUpperCase()+s.slice(1);
let COL={};
const PAL=['#cfc27a','#76a06f','#80aac6','#ada4ac','#c98f7a','#9a86b8','#7fb5a0','#d0b06a'];
function buildCOL(){COL={};T.hexType.forEach((e,i)=>COL[e.key]=e.color||PAL[i%PAL.length]);COL.centre=(T.legend&&T.legend.centre&&T.legend.centre.color)||'#d9985a'}
let T,state,srcName;

function mkName(){
  const S=T.settlement,i=r(S.nameStart[0].length)-1,j=r(S.nameEnd[0].length)-1;
  const starts=S.nameStart.map(c=>c[i]),ends=S.nameEnd.map(c=>c[j]);
  const all=[];starts.forEach(a=>ends.forEach(b=>all.push(cap(a)+b.toLowerCase())));
  const main=pick(all);return {main,alts:all.filter(x=>x!==main)};
}
function genSettlement(){
  const S=T.settlement,n=S.size.length,si=Math.min(r(n),r(n)),sz=S.size[si-1];
  return {size:sz,gov:ranged(S.governance,r(6)+si).text,inh:pick(S.inhabitants),
    feat:pickN(S.features,sz.features||1),ind:pickN(S.industry,sz.industry||1),event:pick(S.events),
    name:mkName(),tavern:sz.tavern?{name:`The ${pick(S.tavernA)} ${pick(S.tavernB)}`,meal:pick(S.meals)}:null};
}
const DIRS=[[1,0],[0,1],[-1,1],[-1,0],[0,-1],[1,-1]];
function buildGrid(R){
  const g=[{n:1,q:0,r:0}];let n=2;
  for(let k=1;k<=R;k++){let q=0,r=-k;for(const[dq,dr]of DIRS)for(let i=0;i<k;i++){g.push({n:n++,q,r});q+=dq;r+=dr}}
  return g;
}
const hexCount=R=>3*R*(R+1)+1;
const GEN=()=>T.generation||{};
const clStrength=()=>{const v=GEN().clusterStrength;return typeof v==='number'&&v>=0?v:3};
function nbMap(grid){
  const pos=new Map(grid.map(g=>[g.q+','+g.r,g.n])),nb=new Map();
  grid.forEach(g=>nb.set(g.n,DIRS.map(([a,b])=>pos.get((g.q+a)+','+(g.r+b))).filter(Boolean)));
  return nb;
}
function pickBiome(neighKeys,strength){
  const w=T.hexType.map(e=>(e.max-e.min+1)*(1+strength*neighKeys.filter(k=>k===e.key).length));
  let x=rng()*w.reduce((a,b)=>a+b,0);
  for(let i=0;i<w.length;i++){x-=w[i];if(x<0)return T.hexType[i]}
  return T.hexType[w.length-1];
}
function assignTypes(grid,nb,keep,centreN,strength){
  const ty=new Map();
  keep.forEach((h,n)=>{const e=T.hexType.find(x=>x.key===h.key);if(e)ty.set(n,e)});
  const order=grid.map(g=>g.n).filter(n=>!keep.has(n)&&n!==centreN);
  for(let i=order.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
  order.forEach(n=>{const ks=nb.get(n).map(m=>ty.get(m)&&ty.get(m).key).filter(Boolean);ty.set(n,pickBiome(ks,strength))});
  return ty;
}
function placeSettlements(nb,ty,cand,count){
  const near=GEN().settlementNear||{};
  const wt=n=>{
    const e=ty.get(n);let v=e&&typeof e.settlementWeight==='number'?e.settlementWeight:1;
    nb.get(n).forEach(m=>{const k=ty.get(m)&&ty.get(m).key;if(k&&typeof near[k]==='number')v*=near[k]});
    return Math.max(0,v);
  };

  if(a==='lock'){const h=hx(n);h.locked=!h.locked;$('#h'+n).outerHTML=card(h);drawMap()}
  else if(a==='reroll')reroll(n);
  else $('#h'+n).scrollIntoView({behavior:'smooth',block:'center'});
});
$('#gen').onclick=()=>{$('#seed').value='';generate()};
$('#seed').onchange=generate;
$('#grid').onchange=()=>{$('#seed').value='';setRanges(+$('#grid').value,true);generate()};
$('#smin').oninput=()=>{if(+$('#smin').value>+$('#smax').value)$('#smax').value=$('#smin').value;showRanges()};
$('#smax').oninput=()=>{if(+$('#smax').value<+$('#smin').value)$('#smin').value=$('#smax').value;showRanges()};
$('#txt').onclick=()=>view==='tables'?download(slug()+'-tables.txt',tablesText()):download('hexcrawl.txt',toText());
$('#tab-map').onclick=()=>setView('map');
$('#tablesview').addEventListener('click',e=>{
  const b=e.target.closest('[data-roll]');if(b){doRoll(b.dataset.roll);return}
  if(e.target.closest('#clearrolls')){ROLLS=[];showRolls()}
});
$('#tab-tables').onclick=()=>setView('tables');
$('#png').onclick=exportPNG;
$('#pdf').onclick=()=>view==='tables'?download(slug()+'-tables.pdf',makeTablesPDF(),'application/pdf'):download('hexcrawl.pdf',makePDF(),'application/pdf');
$('#save').onclick=()=>download('hexcrawl.mausmap',JSON.stringify({format:'mausmap',version:1,title:T.title,tables:srcName,seed:$('#seed').value,settings:{radius:+$('#grid').value,min:+$('#smin').value,max:+$('#smax').value,centre:$('#centre').checked,cluster:$('#cluster').checked,terrain:$('#terrain').checked},hook:state.hook,hexes:state.hexes},null,1),'application/json');
$('#mapfile').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(async t=>{try{await loadMap(t,f.name)}catch(err){alert('Could not load '+f.name+': '+err.message)}});e.target.value=''};
async function addFile(f){
  const text=await f.text(),tb=validate(JSON.parse(text)),title=tb.title||'';
  let why='';
  if(SERVER&&SERVER.canSave){
    try{
      const r=await api('?name='+encodeURIComponent(f.name),{method:'POST',body:text}),j=await r.json().catch(()=>({}));
      if(r.ok&&j.name){
        let e=LIB.find(x=>x.id==='server:'+j.name);const upd=!!e;
        if(e){e.json=text;e.title=title}else{e={id:'server:'+j.name,kind:'server',name:j.name,title,json:text};LIB.push(e)}
        return {e,where:'server',upd};
      }
      why=j.error||`the server answered ${r.status}`;
    }catch(err){why='the server could not be reached'}
  }else if(SERVER)why="the server folder isn't writable";
  let e=LIB.find(x=>x.kind==='saved'&&x.name===f.name);const upd=!!e;
  if(e){e.json=text;e.title=title}else{e={id:'saved:'+f.name,kind:'saved',name:f.name,json:text,title};LIB.push(e)}
  return {e,where:'browser',upd,why};
}
$('#file').onchange=async e=>{
  const files=[...e.target.files];e.target.value='';
  let last=null,srv=0,brw=0,upd=0;const bad=[],why=new Set();
  for(const f of files){
    try{const r=await addFile(f);last=r.e;if(r.where==='server')srv++;else brw++;if(r.upd)upd++;if(r.why)why.add(r.why)}
    catch(err){bad.push(`Could not use ${f.name}: ${err.message}`)}
  }
  if(brw)libSave();
  if(last){
    try{
      await useTables(last,true);
      const parts=[];
      if(srv)parts.push(`Saved ${srv} file${srv===1?'':'s'} on the server`);
      if(brw)parts.push(`saved ${brw} in this browser${why.size?` (not saved on the server: ${[...why].join('; ')})`:''}`);
      say(parts.join(', ').replace(/^./,c=>c.toUpperCase())+(upd?` (${upd} replaced)`:'')+'.');
    }catch(err){bad.push(`Could not use ${last.name}: ${err.message}`)}
  }
  renderLib();
  if(bad.length)alert(bad.join('\n'));
};
$('#tbsel').onchange=async()=>{
  const e=LIB.find(x=>x.id===$('#tbsel').value);
  try{await useTables(e,true);say('')}catch(err){alert(`Could not use ${e.name}: ${err.message}`);renderLib()}
};
$('#tbdel').onclick=async()=>{
  const e=cur();if(!e)return;
  if(e.kind==='server'){
    if(!confirm(`Delete ${e.name} from the server? This removes it for everyone who uses this page.`))return;
    try{
      const r=await api(`?action=delete&name=${encodeURIComponent(e.name)}`,{method:'POST'});
      if(!r.ok){const j=await r.json().catch(()=>({}));alert(j.error||`The server answered ${r.status}.`);return}
    }catch(err){alert('The server could not be reached.');return}
  }else if(e.kind==='saved'){
    if(!confirm(`Remove ${e.name} from this browser?`))return;
  }else return;
  LIB=LIB.filter(x=>x!==e);if(e.kind==='saved')libSave();
  await useTables(defaultEntry(),true);say(`Removed ${e.name}.`);
};
(async()=>{
  LIB=[{id:'builtin',kind:'builtin',name:'built-in copy',json:$('#default-tables').textContent}];
  let hostedErr='';
  try{
    const r=await fetch(API,{headers:{'X-Requested-With':'hexcrawl'}});
    if(r.ok&&/json/.test(r.headers.get('content-type')||'')){
      const j=await r.json();
      if(j&&Array.isArray(j.tables)){
        SERVER={canSave:!!j.canSave,needsKey:!!j.needsKey,protected:j.protected||[]};
        j.tables.forEach(x=>LIB.push({id:'server:'+x.name,kind:'server',name:x.name,title:x.title||'',json:null}));
      }
    }
  }catch(e){}
  if(!SERVER){
    try{
      const res=await fetch('hexcrawl-tables.json');
      if(res.ok){const txt=await res.text();try{validate(JSON.parse(txt));LIB.push({id:'hosted',kind:'hosted',name:'hexcrawl-tables.json',json:txt})}catch(e){hostedErr=e.message}}
    }catch(e){}
  }
  try{
    JSON.parse(store.get('hexcrawl.library')||'[]').forEach(s=>{
      try{const tb=validate(JSON.parse(s.json));LIB.push({id:'saved:'+s.name,kind:'saved',name:s.name,json:s.json,title:tb.title||''})}catch(e){}
    });
  }catch(e){}
  LIB.forEach(e=>{if(e.title===undefined){try{e.title=JSON.parse(e.json).title||''}catch(x){e.title=''}}});
  const want=store.get('hexcrawl.current'),start=LIB.find(e=>e.id===want)||defaultEntry();
  try{await useTables(start,false)}catch(e){await useTables(LIB[0],false)}
  initControls();generate();renderLib();
  if(SERVER&&!SERVER.canSave)say("The server folder isn't writable, so uploads are saved in this browser.");
  else if(hostedErr)say(`hexcrawl-tables.json was ignored: ${hostedErr}`);
})();
</script>
