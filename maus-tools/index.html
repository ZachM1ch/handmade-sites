<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site &amp; Settlement Generator</title>
<link rel="icon" href="data:,">
<style>
:root{--ink:#1c1e1b;--paper:#e9ebe6;--card:#f6f7f3;--line:#b9bdb2;--mute:#5d6258}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 "Helvetica Neue",Arial,sans-serif}
header.top{padding:20px 16px 12px;border-bottom:2px solid var(--ink);background:var(--card)}
h1{font:700 30px/1.1 Georgia,"Palatino Linotype",serif;margin:0 0 4px;letter-spacing:.5px}
#src{color:var(--mute);font-size:13px;margin:0 0 10px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar+.bar{margin-top:8px}
button,.btn{font:inherit;padding:7px 12px;border:1.5px solid var(--ink);background:var(--ink);color:#fff;border-radius:3px;cursor:pointer}
button.alt,.btn{background:transparent;color:var(--ink)}
button:focus-visible,.btn:focus-within,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #2f6fb3;outline-offset:2px}
.bar label{font-size:14px}select{font:inherit;padding:5px}input[type=range]{vertical-align:middle}output{display:inline-block;min-width:2.2ch;font-weight:700}
.seed{font:inherit;padding:5px;border:1.5px solid var(--ink);background:#fff;width:11em}
.tabs{display:flex;gap:4px;margin:0 0 10px;flex-wrap:wrap}
.tabs button{background:transparent;color:var(--ink);padding:5px 18px;border-bottom-width:3px}
.tabs button[aria-selected=true]{background:var(--ink);color:#fff}
body:not(.tab-site) .sitectl,body:not(.tab-settlement) .setctl,body.tab-tables .gen{display:none!important}
main{max-width:1240px;margin:0 auto;padding:16px}
#work{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:840px){#work{grid-template-columns:1fr}}
#hexpanel{position:sticky;top:10px;max-height:calc(100vh - 20px);overflow:auto}
@media (max-width:840px){#hexpanel{position:static;max-height:none}}
.card{background:var(--card);border:1px solid var(--line);border-left:8px solid var(--c,#999);padding:10px 12px;margin-bottom:12px}
.card header{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.num{flex:none;width:34px;height:34px;border-radius:50%;background:var(--c,#999);border:1.5px solid var(--ink);font:700 17px/31px Georgia,serif;text-align:center}
.card h3{margin:0;font:700 17px/1.2 Georgia,serif}.lm{color:var(--mute);font-size:14px}
.card p{margin:6px 0}.card i{color:var(--mute)}
h2{font:700 22px Georgia,"Palatino Linotype",serif;margin:22px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--ink)}
h4{font:700 15px Georgia,serif;margin:12px 0 4px}
.set{margin:8px 0;padding:8px 10px;background:#fff;border:1px solid var(--line)}
.alt-n{font-size:12.5px;color:var(--mute);margin:2px 0 6px}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:14px}dt{font-weight:700}dd{margin:0}
.desc,.ti,.rn{width:100%;font:inherit;border:0;border-bottom:1.5px dotted var(--mute);background:transparent;padding:4px 0}
.ti{font:700 22px Georgia,serif}.rn{font:700 16px Georgia,serif;padding:1px 0}
.note{color:var(--mute);font-size:14px}
.fld{display:block;font-size:14px;font-weight:700;margin:8px 0 2px}.fld select,.fld input{font:inherit;font-weight:400;width:100%;padding:5px;border:1.5px solid var(--ink);background:#fff}
.row{display:flex;gap:6px;align-items:center}.row input{flex:1}
.ri{background:transparent;color:var(--ink);border:1.5px solid var(--ink);border-radius:50%;width:28px;height:28px;padding:0;font-size:15px;line-height:1;flex:none}
.ri:hover{background:var(--ink);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.chip{display:inline-block;font-size:12.5px;padding:1px 8px;border:1px solid var(--ink);border-left:6px solid var(--c,#ccc);background:#fff;border-radius:3px}
button.chip{color:var(--ink);cursor:pointer}button.chip:hover{background:#fff0b8}
details.ro{margin-top:6px;border-top:1px dotted var(--mute)}details.ro summary{cursor:pointer;font-size:14px;padding:4px 0;color:var(--mute)}
pre{white-space:pre-wrap;font:13.5px/1.45 "Helvetica Neue",Arial,sans-serif;margin:4px 0;background:#fff;border:1px solid var(--line);padding:6px 8px;max-height:20em;overflow:auto}
.adds{background:var(--card);border:1.5px solid var(--ink);padding:8px 12px}
.adds h4{margin-top:0}
details.add{border-top:1px dotted var(--line);padding:4px 0}details.add summary{cursor:pointer}details.add small{color:var(--mute)}
.sm{padding:2px 9px;font-size:13px}
.th{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;font-size:14.5px;margin:6px 0}
.th dt{font-weight:700}.th dd{margin:0}
.why{background:#fff0b8;border:1px solid #d4a017;padding:4px 10px;font-size:13.5px}
.smap{margin:6px 0 4px;background:#fff;border:1px solid var(--line);padding:6px;overflow-x:auto}.smap svg{display:block;max-width:100%;height:auto;margin:0 auto}
#rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
#rooms .card{margin:0}
.tr{margin:6px 0;padding:5px 8px;background:#fff8dc;border-left:4px solid #d4a017;font-size:14px}.tr ul{margin:3px 0 0;padding-left:18px}.tr small{color:var(--mute)}
textarea{display:block;width:100%;font:inherit;font-size:14px;line-height:1.4;min-height:70px;resize:vertical;border:1px solid var(--line);padding:6px 8px;background:#fff}
ol.enc{padding-left:24px;margin:4px 0}ol.enc li{margin:3px 0}ol.enc input{width:100%;font:inherit;font-size:14.5px;border:0;border-bottom:1px dotted var(--mute);background:transparent;padding:3px 0}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.cr{background:#fff;border:1px solid var(--line);padding:6px 10px;font-size:14px}.cr b{font-family:Georgia,serif;font-size:15px}.cr p{margin:2px 0}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
.npc{background:#fff;border:1px solid var(--line);border-left:6px solid #d9985a;padding:6px 10px;margin:8px 0}
.npc header{display:flex;gap:8px;align-items:center}.npc header input{flex:1}
.empty{padding:30px;text-align:center;color:var(--mute);border:2px dashed var(--line)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:30;background:var(--ink);color:#fff;padding:10px 16px;max-width:90vw}
#draftbar{background:#fff0b8;border:1px solid #d4a017;padding:8px 12px;margin-bottom:12px}
/* tables view */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;align-items:start}
.tbl{background:var(--card);border:1px solid var(--line);border-left:8px solid var(--c,var(--ink));padding:8px 10px;overflow-x:auto}
.tbl.wide{grid-column:1/-1}
.tbl h3{margin:0;font:700 16px Georgia,serif;display:flex;justify-content:space-between;gap:8px;align-items:center}
.tbl h3 .hr{display:flex;gap:8px;align-items:center;font:700 13px Arial,sans-serif;color:var(--mute);white-space:nowrap}
.tbl .note{margin:2px 0 6px;font-size:13px}
.tbl table{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;border-bottom:2px solid var(--ink);padding:3px 10px 3px 4px;white-space:nowrap}
.tbl td{padding:3px 10px 3px 4px;vertical-align:top}
.tbl tbody tr:nth-child(even) td{background:rgba(0,0,0,.05)}
.tbl td:first-child,.tbl td.nw{width:1%;white-space:nowrap;font-weight:700}
.rollbtn{padding:2px 12px;font-size:13px}
.tbl .res{margin:2px 0 6px;font-size:14px;padding:4px 8px;background:#fff3c4;border-left:4px solid #d4a017}.tbl .res:empty{display:none}
.tbl tr.hit td,.tbl td.hit{background:#ffe08a!important;font-weight:700}
.hist{position:sticky;top:0;z-index:5;background:var(--card);border:1.5px solid var(--ink);padding:6px 12px;margin:0 0 14px;box-shadow:0 3px 8px rgba(0,0,0,.12)}
.hist[hidden]{display:none}.hist header{display:flex;justify-content:space-between;align-items:center}
.hist ol{margin:4px 0 0;padding-left:20px;font-size:13.5px;max-height:7.5em;overflow:auto}.hist li span{color:var(--mute)}
#tablesview h2:first-of-type{margin-top:0}
[hidden]{display:none!important}
#tbbar{margin-bottom:8px}#tbsel{max-width:70vw}#tbmsg{font-size:13px;color:var(--mute)}
@media print{.bar,.tabs,#src,#hexpanel,.ri,.actions,.rollbtn,.hist,#draftbar,.addbtn{display:none!important}body{background:#fff}header.top{background:#fff}#work{display:block}.card{break-inside:avoid}textarea{border:0;resize:none}}
</style>
</head>
<body class="tab-site">
<header class="top">
  <h1 id="title">Site &amp; Settlement Generator</h1>
  <p id="src"></p>
  <nav class="tabs" role="tablist" aria-label="View">
    <button role="tab" id="tab-site" aria-selected="true">Adventure site</button>
    <button role="tab" id="tab-settlement" aria-selected="false">Settlement</button>
    <button role="tab" id="tab-tables" aria-selected="false">Tables</button>
  </nav>
  <div class="bar" id="tbbar">
    <label>Tables <select id="tbsel" aria-label="Active tables"></select></label>
    <button class="alt" id="tbdel" hidden>Remove</button>
    <label class="btn">Add tables JSON<input id="file" type="file" accept=".json,application/json" multiple hidden></label>
    <button class="alt" id="tbget" title="Download the active tables as one JSON file, to edit into your own set">Download tables JSON</button>
    <span id="tbmsg" role="status"></span>
  </div>
  <div class="bar">
    <label class="btn" title="Open a .maushex file exported from the hexcrawl generator">Import .maushex<input id="hexfile" type="file" accept=".maushex,application/json" hidden></label>
    <button class="alt" id="export" title="Save the hex with your additions, ready to import into the hexcrawl generator">Export .maushex</button>
    <button class="alt" id="newhex">New hex</button>
    <button class="alt" id="pdf">Download PDF</button>
    <button class="alt" id="txt">Download text</button>
    <button class="alt sitectl" id="png">Download map PNG</button>
  </div>
  <div class="bar sitectl">
    <button id="gensite">Generate site</button>
    <label>Seed <input id="aseed" class="seed" type="text" placeholder="seed code" aria-label="Site seed code"></label>
    <label>Rooms <input id="nrooms" type="range" min="3" max="12" value="6"> <output id="vrooms"></output></label>
    <label title="Use the hex's landmark, detail, biome and neighbours to pick the construction, inhabitants and ruination"><input id="fit" type="checkbox" checked> Fit to hex</label>
  </div>
  <div class="bar setctl">
    <button id="gensett">Generate settlement</button>
    <label>Seed <input id="sseed" class="seed" type="text" placeholder="seed code" aria-label="Settlement seed code"></label>
    <label>Notable mice <input id="nnpc" type="range" min="0" max="6" value="2"> <output id="vnpc"></output></label>
    <button class="alt" id="fromhex" hidden>Start from this hex's settlement</button>
  </div>
</header>
<main>
  <div class="bar" id="draftbar" hidden><span id="draftmsg"></span><button id="draftrestore">Restore</button><button class="alt" id="draftdrop">Discard</button></div>
  <div id="work">
    <aside id="hexpanel" aria-label="Hex"></aside>
    <section>
      <div id="siteview"></div>
      <div id="settview" hidden></div>
    </section>
  </div>
  <div id="tablesview" hidden></div>
</main>
<div id="toast" role="status" hidden></div>

  const s=sett.s,rb=k=>`<button class="ri" title="Reroll" aria-label="Reroll ${k}" onclick="rerollSet('${k}')">&#x21bb;</button>`;
  const rows=[['Size',`${s.size.name}, ${s.size.note}`,'size'],['Governance',s.gov,'gov'],['Inhabitants',s.inh,'inh'],['Notable feature',s.feat.join('; '),'feat'],['Industry',s.ind.join('; '),'ind'],['Event',s.event,'event']];
  if(s.tavern)rows.push(['Tavern',`${s.tavern.name} (specialty: ${s.tavern.meal})`,'tavern']);
  el.innerHTML=`<article class="card" style="--c:#d9985a"><div class="row"><input class="ti" value="${esc(s.name.main)}" aria-label="Settlement name" oninput="sett.s.name.main=this.value;stouched()">${rb('name')}</div>
<p class="lm">Settlement${sett.from?` &middot; from ${sett.from==='new'?'this new hex':'hex '+esc(sett.from)}`:''}${sett.seed?` &middot; seed ${esc(sett.seed)}`:''}</p>
<div class="chips">Other names: ${(s.name.alts||[]).map((a,i)=>`<button class="chip" title="Use this name" onclick="useAlt(${i})">${esc(a)}</button>`).join('')}</div>
<dl class="th">${rows.map(([l,v,k])=>`<dt>${l}</dt><dd>${esc(v)}</dd>${rb(k)}`).join('')}</dl></article>
<h2>Notable mice <button class="ri" title="Add a mouse" aria-label="Add a notable mouse" onclick="addNPC()">+</button></h2>
${sett.npcs.length?'':'<p class="note">None yet. Press + to add one.</p>'}
${sett.npcs.map((n,i)=>`<div class="npc"><header><input class="rn" value="${esc(n.name)}" aria-label="Name of mouse ${i+1}" oninput="sett.npcs[${i}].name=this.value;stouched()"><button class="ri" title="Reroll" aria-label="Reroll mouse ${i+1}" onclick="rerollNPC(${i})">&#x21bb;</button><button class="ri" title="Remove" aria-label="Remove mouse ${i+1}" onclick="delNPC(${i})">&times;</button></header>
<dl><dt>Position</dt><dd>${esc(n.social[0])} (pays ${esc(n.social[1])} for a service)</dd><dt>Birthsign</dt><dd>${esc(n.sign[0])}: ${esc(n.sign[1])}</dd><dt>Appearance</dt><dd>${esc(n.appearance)}</dd><dt>Quirk</dt><dd>${esc(n.quirk)}</dd><dt>Wants</dt><dd>${esc(n.wants)}</dd><dt>Relationship</dt><dd>${esc(n.relationship)}</dd></dl>
<textarea rows="2" placeholder="Notes" aria-label="Notes for mouse ${i+1}" oninput="sett.npcs[${i}].notes=this.value;stouched()">${esc(n.notes)}</textarea></div>`).join('')}
<h2>Notes</h2><textarea rows="4" placeholder="Anything else about this settlement" aria-label="Settlement notes" oninput="sett.notes=this.value;stouched()">${esc(sett.notes)}</textarea>

}
function settLines(x){
  const s=x.s,L=[`${s.size.name}, ${s.size.note}`,`Other names: ${(s.name.alts||[]).join(', ')}`];
  setRows(s).forEach(([k,v])=>L.push(`${k}: ${v}`));
  if(x.npcs.length){L.push('','NOTABLE MICE');x.npcs.forEach(n=>{L.push(`- ${n.name}: ${npcLine(n)}`);if(n.notes.trim())L.push(...n.notes.trim().split('\n').map(l=>'  '+l))})}
  if(x.notes.trim())L.push('',...x.notes.trim().split('\n'));
  return L;
}
function addSett(){addAddition('settlement','Settlement: '+(sett.s.name.main.trim()||'Unnamed'),settLines(sett).join('\n'))}
function makeHexSet(){
  if(doc.hex.set&&!confirm('This new hex already has a settlement. Replace it?'))return;
  doc.hex.set=clone(sett.s);doc.hex.detail='Mouse settlement';
  if(sett.npcs.length||sett.notes.trim())addAddition('settlement','Settlement: '+sett.s.name.main,settLines(sett).join('\n'));
  else{markDirty();renderHex();toast('The settlement is now this hex\'s settlement.')}
}

function doRoll(key){
  const [si,ti]=key.split('-').map(Number),t=TB[si]&&TB[si].tables[ti];if(!t||!t.roll)return;
  const res=t.roll(),el=document.querySelector(`.tbl[data-t="${key}"]`);
  el.querySelectorAll('.hit').forEach(x=>x.classList.remove('hit'));
  const trs=el.querySelectorAll('tbody tr');
  res.hits.forEach(([row,col])=>{const tr=trs[row];if(!tr)return;if(col===undefined)tr.classList.add('hit');else if(tr.children[col])tr.children[col].classList.add('hit')});
  el.querySelector('.res').innerHTML=`<b>${esc(res.label)}</b> &rarr; ${esc(res.text)}`;
  ROLLS.unshift({t:t.title,label:res.label,text:res.text});ROLLS=ROLLS.slice(0,10);showRolls();
  const hit=el.querySelector('.hit');if(hit){const b=hit.getBoundingClientRect();if(b.top<80||b.bottom>innerHeight)hit.scrollIntoView({block:'center',behavior:'smooth'})}
}
$('#tablesview').addEventListener('click',e=>{const b=e.target.closest('[data-roll]');if(b){doRoll(b.dataset.roll);return}if(e.target.closest('#clearrolls')){ROLLS=[];showRolls()}});
function tablesText(){

  TB.forEach(s=>{L.push(s.title.toUpperCase(),'='.repeat(s.title.length),s.intro,'');
    s.tables.forEach(t=>{const h=t.dice?`${t.title} (${t.dice})`:t.title;L.push(h,'-'.repeat(h.length));if(t.note)L.push(t.note);
      const rows=[t.head,...t.rows],w=t.head.map((_,i)=>Math.max(...rows.map(r=>String(r[i]).length)));
      rows.forEach((r,ri)=>{L.push(r.map((c,i)=>i===r.length-1?String(c):String(c).padEnd(w[i])).join('  ').trimEnd());if(ri===0)L.push(w.map(k=>'-'.repeat(k)).join('  '))});L.push('')})});

function pdfFromPages(pages,W,H){
  let out='%PDF-1.4\n';const off=[],add=o=>{off.push(out.length);out+=`${off.length} 0 obj\n${o}\nendobj\n`};
  add('<</Type/Catalog/Pages 2 0 R>>');

  add('<</Type/Font/Subtype/Type1/BaseFont/Helvetica/Encoding/WinAnsiEncoding>>');
  add('<</Type/Font/Subtype/Type1/BaseFont/Helvetica-Bold/Encoding/WinAnsiEncoding>>');
  pages.forEach((p,i)=>{const c=p.join('\n');add(`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${W} ${H}]/Resources<</Font<</F1 3 0 R/F2 4 0 R>>>>/Contents ${6+2*i} 0 R>>`);add(`<</Length ${c.length}>>\nstream\n${c}\nendstream`)});
  const xr=out.length;
  out+=`xref\n0 ${off.length+1}\n0000000000 65535 f \n`+off.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<</Size ${off.length+1}/Root 1 0 R>>\nstartxref\n${xr}\n%%EOF`;
  const u=new Uint8Array(out.length);for(let i=0;i<out.length;i++)u[i]=out.charCodeAt(i)&255;
  return u;
}
function makePDF(items){

  const wd=(s,z,b)=>{cv.font=`${b?'bold ':''}${z}px Helvetica,Arial,sans-serif`;return cv.measureText(lat(s)).width};
  const rgb=h=>[1,3,5].map(i=>(parseInt(h.substr(i,2),16)/255).toFixed(3)).join(' ');
  const page=()=>{cur=[];pages.push(cur);y=M};
  const txt=(x,yy,s,z,b,c)=>cur.push(`BT /F${b?2:1} ${z} Tf ${c||'0 0 0'} rg ${x.toFixed(1)} ${(H-yy).toFixed(1)} Td (${pe(s)}) Tj ET`);
  const rect=(x,yy,w,h,c)=>cur.push(`${c} rg ${x.toFixed(1)} ${(H-yy-h).toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)} re f`);
  const wrap=(s,z,b,mw)=>{const o=[];let l='';for(const w of String(s).split(' ')){const t=l?l+' '+w:w;if(l&&wd(t,z,b)>mw){o.push(l);l=w}else l=t}return o.concat(l)};
  const ST={title:[20,1,26],h:[14,1,19],h3:[11.5,1,15],p:[10,0,13],small:[9,0,13]};
  page();
  items.forEach(it=>{
    const [z,b,lh]=ST[it.t],ind=(it.ind||0)*16+(it.c?12:0),mw=W-2*M-ind;
    const ls=String(it.s).split('\n').flatMap(p=>p.trim()?wrap(p,z,b,mw):['']);
    if(it.t==='h'){if(y+lh+40>H-M)page();else y+=10}
    if(it.t==='h3'){if(y+lh+30>H-M)page();else y+=5}
    ls.forEach((l,j)=>{if(y+lh>H-M)page();if(j===0&&it.c)rect(M+(it.ind||0)*16,y+z*0.1,8,z*0.8,rgb(it.c));txt(M+ind,y+z*0.9,l,z,b,it.grey?'0.35 0.35 0.35':null);y+=lh});
    if(it.t==='h'){rect(M,y-2,W-2*M,1,'0 0 0');y+=4}
  });
  return pdfFromPages(pages,W,H);
}
function svgToPNG(parts,name){
  const {svg,W,H}=parts,sc=Math.max(2,Math.min(5,2200/W)),img=new Image();
  img.onload=()=>{const cv=document.createElement('canvas');cv.width=Math.round(W*sc);cv.height=Math.round(H*sc);const c=cv.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,cv.width,cv.height);c.drawImage(img,0,0,cv.width,cv.height);cv.toBlob(b=>{if(b)download(name,b,'image/png');else alert('The browser could not create the image.')},'image/png')};
  img.onerror=()=>alert('The browser could not draw the map image.');
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
$('#txt').onclick=()=>{
  if(view==='tables')return download(slug(D.title)+'-site-tables.txt',tablesText());
  if(view==='site'){if(!site)return;download(slug(site.title)+'-site.txt',[site.title.toUpperCase(),hexLine(),'',...siteLines(site)].join('\n'))}
  else{if(!sett)return;download(slug(sett.s.name.main)+'-settlement.txt',[sett.s.name.main.toUpperCase(),...settLines(sett)].join('\n'))}
};
$('#pdf').onclick=()=>{
  if(view==='site'){if(site)download(slug(site.title)+'-site.pdf',makePDF(siteDoc()),'application/pdf')}
  else if(view==='settlement'){if(sett)download(slug(sett.s.name.main)+'-settlement.pdf',makePDF(settDoc()),'application/pdf')}
};
$('#png').onclick=()=>{if(site)svgToPNG(siteMap(site),slug(site.title)+'-map.png')};

// ---------- view, drafts, start ----------
function setView(v){
  view=v;['site','settlement','tables'].forEach(x=>{document.body.classList.toggle('tab-'+x,v===x);$('#tab-'+x).setAttribute('aria-selected',String(v===x))});
  $('#work').hidden=v==='tables';$('#tablesview').hidden=v!=='tables';$('#siteview').hidden=v!=='site';$('#settview').hidden=v!=='settlement';
  $('#pdf').hidden=v==='tables';$('#txt').textContent=v==='tables'?'Download tables text':'Download text';
  if(v==='tables'&&!TB.length)renderTables();
  saveDraft();
}
function showOut(){$('#vrooms').textContent=$('#nrooms').value;$('#vnpc').textContent=$('#nnpc').value}
let dT=null;
function saveDraft(){if(!$('#draftbar').hidden)return;clearTimeout(dT);dT=setTimeout(()=>{if(!doc||!$('#draftbar').hidden)return;try{localStorage.setItem('mausgen.draft',JSON.stringify({t:Date.now(),tables:curId,doc,docName,docNew,dirty,site,sett,view}))}catch(e){}},600)}
function checkDraft(){
  try{
    const d=JSON.parse(localStorage.getItem('mausgen.draft')||'null');
    if(!d||!d.doc||!d.doc.hex)return false;
    if(!d.site&&!d.sett&&!d.dirty)return false;
    $('#draftmsg').textContent=`Unsaved work from ${new Date(d.t).toLocaleString()} was found in this browser${d.docNew?'':` (hex ${d.doc.hex.n}: ${hexName(d.doc.hex)})`}.`;$('#draftbar').hidden=false;
    $('#draftrestore').onclick=async()=>{
      if(d.tables&&d.tables!==curId){const e=LIB.find(x=>x.id===d.tables);if(e){try{await useTables(e,false)}catch(err){toast('The tables used by that work could not be loaded, so '+srcName+' is used.')}}else toast('The tables used by that work are no longer in your list, so '+srcName+' is used.')}
      doc=d.doc;docName=d.docName||'';docNew=!!d.docNew;dirty=!!d.dirty;site=d.site||null;sett=d.sett||null;renderHex();renderSite();renderSett();setView(d.view||'site');$('#aseed').value=site&&site.seed||'';$('#sseed').value=sett&&sett.seed||'';$('#draftbar').hidden=true};
    $('#draftdrop').onclick=()=>{try{localStorage.removeItem('mausgen.draft')}catch(e){}$('#draftbar').hidden=true};
    return true;
  }catch(e){return false}
}
$('#tab-site').onclick=()=>setView('site');$('#tab-settlement').onclick=()=>setView('settlement');$('#tab-tables').onclick=()=>setView('tables');
$('#gensite').onclick=genSite;$('#aseed').onchange=genSite;$('#gensett').onclick=genSett;$('#sseed').onchange=genSett;$('#fromhex').onclick=settFromHex;
$('#nrooms').oninput=showOut;$('#nnpc').oninput=showOut;
addEventListener('beforeunload',e=>{if(dirty&&doc&&doc.additions.length){e.preventDefault();e.returnValue=''}});
// ---------- tables library: built in, hosted, on the server (tables.php), in this browser ----------
const mem={};
const store={
  get(k){try{return localStorage.getItem(k)}catch(e){return k in mem?mem[k]:null}},
  set(k,v){mem[k]=v;try{localStorage.setItem(k,v);return true}catch(e){return false}}
};
const LIBKEY='sitegen.library',CURKEY='sitegen.current',API='tables.php';
let LIB=[],curId='',SERVER=null;
const curE=()=>LIB.find(e=>e.id===curId);
const say=m=>{$('#tbmsg').textContent=m||''};
function libSave(){
  const ok=store.set(LIBKEY,JSON.stringify(LIB.filter(e=>e.kind==='saved').map(e=>({name:e.name,json:e.json}))));
  if(!ok)say("Couldn't save to this browser's storage (private mode or full). The file works until you close the page.");
  return ok;
}
function renderLib(){
  const lab=e=>`${e.title||e.name}${e.title&&e.title!==e.name?' - '+e.name:''}${e.kind==='builtin'?' (built in)':e.kind==='hosted'?' (hosted)':e.kind==='shared'?' (from the hexcrawl generator)':''}${e.sitesOnly?' [sites only]':''}`;
  const grp=(name,k)=>{const l=LIB.filter(e=>k.includes(e.kind));return l.length?`<optgroup label="${name}">${l.map(e=>`<option value="${esc(e.id)}"${e.id===curId?' selected':''}>${esc(lab(e))}</option>`).join('')}</optgroup>`:''};
  $('#tbsel').innerHTML=grp('Included',['builtin','hosted'])+grp('Saved on the server',['server'])+grp('Saved in this browser',['saved','shared']);
  $('#tbsel').value=curId;
  const c=curE();
  $('#tbdel').hidden=!(c&&(c.kind==='saved'||(c.kind==='server'&&SERVER&&SERVER.canSave&&!SERVER.protected.includes(c.name))));
}
const keyGet=()=>{try{return sessionStorage.getItem('hexcrawl.key')||''}catch(e){return ''}};
const keySet=v=>{try{sessionStorage.setItem('hexcrawl.key',v)}catch(e){}};
async function api(q,o,retry){
  o=o||{};o.headers=Object.assign({'X-Requested-With':'hexcrawl'},o.headers||{});
  if(o.method==='POST'&&SERVER&&SERVER.needsKey){
    let k=keyGet();if(!k){k=prompt('Enter the upload password for this site:')||'';keySet(k)}
    o.headers['X-Tables-Key']=k;
  }
  const res=await fetch(API+q,o);
  if(res.status===401&&!retry){keySet('');return api(q,o,true)}
  return res;
}
async function ensureJson(e){
  if(typeof e.json==='string')return;
  const res=await api('?name='+encodeURIComponent(e.name));
  if(!res.ok)throw new Error(`the server could not return ${e.name} (${res.status})`);
  e.json=await res.text();
  if(!e.title){try{e.title=JSON.parse(e.json).title||''}catch(x){}}
}
// Anything the user has made (a site, a settlement) is rerolled with the new tables, like a new map in the hexcrawl generator.
function guardWork(){
  const ed=(site&&site.edited)||(sett&&sett.edited&&!sett.from);
  return !ed||confirm('Switching tables rerolls the current site and settlement. Your edits will be lost unless you added them to the hex. Continue?');
}
function useEntry(e,regen){
  const t=parseTables(e.json);
  applyTables(t);srcName=e.name;curId=e.id;store.set(CURKEY,e.id);
  TB=[];if(view==='tables')renderTables();
  if(doc&&docNew&&!dirty&&!D.hexType.some(x=>x.key===doc.hex.key))doc=newDoc(D.hexType[0].key);
  if(doc)renderHex();
  if(regen){
    if(site){site.edited=false;$('#aseed').value='';genSite()}
    if(sett&&!sett.from){sett.edited=false;$('#sseed').value='';genSett()}else renderSett();
  }else{renderSite();renderSett()}
  renderLib();saveDraft();
}
async function useTables(e,regen){await ensureJson(e);useEntry(e,regen)}
const defaultEntry=()=>LIB.find(e=>e.id==='hosted')||LIB.find(e=>e.id==='server:hexcrawl-tables.json')||LIB.find(e=>e.id==='server:mausritter-tables.json')||LIB.find(e=>e.id==='builtin');
async function addFile(f){
  const text=await f.text(),tb=parseTables(text),raw=JSON.parse(text),title=raw.title||'',sitesOnly=!HEX_KEYS.every(k=>raw[k]!==undefined);
  let why='';
  if(SERVER&&SERVER.canSave){
    try{
      const res=await api('?for=sites&name='+encodeURIComponent(f.name),{method:'POST',body:text}),j=await res.json().catch(()=>({}));
      if(res.ok&&j.name){
        let e=LIB.find(x=>x.id==='server:'+j.name);const upd=!!e;
        if(e){e.json=text;e.title=title;e.sitesOnly=sitesOnly}else{e={id:'server:'+j.name,kind:'server',name:j.name,title,sitesOnly,json:text};LIB.push(e)}
        return {e,where:'server',upd};
      }
      why=j.error||`the server answered ${res.status}`;
    }catch(err){why='the server could not be reached'}
  }else if(SERVER)why="the server folder isn't writable";
  let e=LIB.find(x=>x.kind==='saved'&&x.name===f.name);const upd=!!e;
  if(e){e.json=text;e.title=title;e.sitesOnly=sitesOnly}else{e={id:'saved:'+f.name,kind:'saved',name:f.name,json:text,title,sitesOnly};LIB.push(e)}
  return {e,where:'browser',upd,why};
}
$('#file').onchange=async e=>{
  const files=[...e.target.files];e.target.value='';
  if(!guardWork())return;
  let last=null,srv=0,brw=0,upd=0;const bad=[],why=new Set();
  for(const f of files){
    try{const res=await addFile(f);last=res.e;if(res.where==='server')srv++;else brw++;if(res.upd)upd++;if(res.why)why.add(res.why)}
    catch(err){bad.push(`Could not use ${f.name}: ${err instanceof SyntaxError?'it is not valid JSON':err.message}`)}
  }
  if(brw)libSave();
  if(last){
    try{
      await useTables(last,true);
      const parts=[];
      if(srv)parts.push(`Saved ${srv} file${srv===1?'':'s'} on the server`);
      if(brw)parts.push(`saved ${brw} in this browser${why.size?` (not saved on the server: ${[...why].join('; ')})`:''}`);
      say(parts.join(', ').replace(/^./,c=>c.toUpperCase())+(upd?` (${upd} replaced)`:'')+'.');
    }catch(err){bad.push(`Could not use ${last.name}: ${err.message}`)}
  }
  renderLib();
  if(bad.length)alert(bad.join('\n'));
};
$('#tbsel').onchange=async()=>{
  const e=LIB.find(x=>x.id===$('#tbsel').value);
  if(!guardWork()){renderLib();return}
  try{await useTables(e,true);say('')}catch(err){alert(`Could not use ${e.name}: ${err.message}`);renderLib()}
};
$('#tbdel').onclick=async()=>{
  const e=curE();if(!e)return;
  if(e.kind==='server'){
    if(!confirm(`Delete ${e.name} from the server? This removes it for everyone who uses these pages, including the hexcrawl generator.`))return;
    try{
      const res=await api(`?action=delete&name=${encodeURIComponent(e.name)}`,{method:'POST'});
      if(!res.ok){const j=await res.json().catch(()=>({}));alert(j.error||`The server answered ${res.status}.`);return}
    }catch(err){alert('The server could not be reached.');return}
  }else if(e.kind==='saved'){
    if(!confirm(`Remove ${e.name} from this browser?`))return;
  }else return;
  if(!guardWork())return;
  LIB=LIB.filter(x=>x!==e);if(e.kind==='saved')libSave();
  await useTables(defaultEntry(),true);say(`Removed ${e.name}.`);
};
$('#tbget').onclick=()=>{
  const name=/-tables\.json$/i.test(srcName)?srcName:slug(D.title||'my')+'-tables.json';
  download(name,JSON.stringify(D,null,1),'application/json');
  say(`Downloaded ${name}: every table this page uses${D.details?', plus the hexcrawl sections, so it works in both generators':''}. Edit it and add it back with "Add tables JSON".`);
};
async function loadLibrary(){
  LIB=[{id:'builtin',kind:'builtin',name:'built-in copy',json:$('#default-tables').textContent,title:BASE.title||''}];
  let hostedErr='';
  try{
    const res=await fetch(API+'?for=sites',{headers:{'X-Requested-With':'hexcrawl'}});
    if(res.ok&&/json/.test(res.headers.get('content-type')||'')){
      const j=await res.json();
      if(j&&Array.isArray(j.tables)){
        SERVER={canSave:!!j.canSave,needsKey:!!j.needsKey,protected:j.protected||[]};
        j.tables.forEach(x=>LIB.push({id:'server:'+x.name,kind:'server',name:x.name,title:x.title||'',sitesOnly:x.kind==='sites',json:null}));
      }
    }
  }catch(e){}
  if(!SERVER){
    for(const n of ['hexcrawl-tables.json','mausritter-tables.json']){
      try{
        const res=await fetch(n);
        if(res.ok){const txt=await res.text();try{const tb=parseTables(txt);LIB.push({id:n==='hexcrawl-tables.json'?'hosted':'hosted:'+n,kind:'hosted',name:n,title:tb.title||'',json:txt})}catch(e){hostedErr=`${n} was ignored: ${e.message}`}}
      }catch(e){}
    }
  }
  const fromStore=(key,kind)=>{try{JSON.parse(store.get(key)||'[]').forEach(s=>{
    if(!s||typeof s.json!=='string'||LIB.some(x=>x.kind!=='builtin'&&x.name===s.name&&(x.kind==='saved'||x.kind==='shared')))return;
    try{const tb=parseTables(s.json);LIB.push({id:kind+':'+s.name,kind,name:s.name,json:s.json,title:tb.title||''})}catch(e){}
  })}catch(e){}};
  fromStore(LIBKEY,'saved');fromStore('hexcrawl.library','shared');
  const want=store.get(CURKEY),start=LIB.find(e=>e.id===want)||defaultEntry();
  try{await useTables(start,false)}catch(e){await useTables(LIB[0],false);say(`${start.name} could not be used: ${e.message}`)}
  if(SERVER&&!SERVER.canSave)say("The server folder isn't writable, so uploads are saved in this browser.");
  else if(hostedErr)say(hostedErr);
}
(async()=>{
  showOut();
  await loadLibrary();
  checkDraft();
  doc=newDoc(D.hexType[0].key);docNew=true;dirty=false;
  renderHex();renderSite();renderSett();setView('site');
})();
</script>
